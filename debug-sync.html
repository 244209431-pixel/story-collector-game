<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>同步调试工具</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #f5f5f5; }
    .log { background: white; padding: 10px; margin: 10px 0; border-radius: 5px; max-height: 400px; overflow-y: auto; }
    .log-item { padding: 5px; border-bottom: 1px solid #eee; }
    .error { color: red; }
    .success { color: green; }
    .info { color: blue; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🔍 同步调试工具</h1>
  
  <div>
    <button onclick="testNetwork()">1. 测试网络连通性</button>
    <button onclick="testJsonBlobAPI()">2. 测试 JsonBlob API</button>
    <button onclick="testCloudSave()">3. 测试 cloudSave</button>
    <button onclick="testManualSync()">4. 测试 manualSync</button>
    <button onclick="clearLog()">清空日志</button>
  </div>
  
  <div class="log" id="log"></div>
  
  <script>
    const LOG = document.getElementById('log');
    
    function log(msg, type='info') {
      const div = document.createElement('div');
      div.className = 'log-item ' + type;
      div.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
      LOG.appendChild(div);
      LOG.scrollTop = LOG.scrollHeight;
      console.log('[debug]', msg);
    }
    
    function clearLog() {
      LOG.innerHTML = '';
      log('日志已清空');
    }
    
    // 1. 测试网络连通性
    async function testNetwork() {
      log('开始测试网络连通性...');
      try {
        const resp = await fetch('https://www.baidu.com', { mode: 'no-cors' });
        log('✅ 网络连通性正常', 'success');
      } catch(e) {
        log('❌ 网络连通性失败: ' + e.message, 'error');
      }
    }
    
    // 2. 测试 JsonBlob API
    async function testJsonBlobAPI() {
      log('开始测试 JsonBlob API...');
      
      // 测试 POST
      try {
        log('测试 POST 请求...');
        const testData = { test: true, time: Date.now() };
        const resp = await fetch('https://jsonblob.com/api/jsonBlob', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(testData)
        });
        
        log('POST 响应状态: ' + resp.status);
        log('POST 响应 headers: ' + JSON.stringify([...resp.headers.entries()]));
        
        if(resp.ok) {
          const loc = resp.headers.get('Location') || resp.headers.get('location');
          log('✅ POST 成功, Location: ' + loc, 'success');
          
          // 测试 GET
          if(loc) {
            const blobId = loc.split('/').pop();
            log('测试 GET 请求, blobId: ' + blobId);
            
            const resp2 = await fetch('https://jsonblob.com/api/jsonBlob/' + blobId);
            log('GET 响应状态: ' + resp2.status);
            
            if(resp2.ok) {
              const data = await resp2.json();
              log('✅ GET 成功, data: ' + JSON.stringify(data), 'success');
              
              // 测试 PUT
              log('测试 PUT 请求...');
              data.updated = Date.now();
              const resp3 = await fetch('https://jsonblob.com/api/jsonBlob/' + blobId, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
              });
              
              log('PUT 响应状态: ' + resp3.status);
              if(resp3.ok) {
                log('✅ PUT 成功', 'success');
              } else {
                log('❌ PUT 失败: ' + resp3.statusText, 'error');
              }
            } else {
              log('❌ GET 失败: ' + resp2.statusText, 'error');
            }
          }
        } else {
          log('❌ POST 失败: ' + resp.statusText, 'error');
        }
      } catch(e) {
        log('❌ JsonBlob API 测试失败: ' + e.message, 'error');
      }
    }
    
    // 3. 测试 cloudSave（需要先加载 game.js）
    async function testCloudSave() {
      log('测试 cloudSave 函数...');
      log('⚠️ 请先在游戏页面登录，然后再点击此按钮');
      log('⚠️ 确保 game.js 已加载，currentUser 已设置');
      
      if(typeof cloudSave !== 'function') {
        log('❌ cloudSave 函数未定义，请先加载 game.js', 'error');
        return;
      }
      
      if(!currentUser) {
        log('❌ currentUser 未设置，请先登录', 'error');
        return;
      }
      
      try {
        const testData = { ...G, _user: currentUser, _lastSync: Date.now(), _version: 'v11.2' };
        log('开始调用 cloudSave...');
        const result = await cloudSave(testData);
        log('cloudSave 返回结果: ' + result, result ? 'success' : 'error');
      } catch(e) {
        log('❌ cloudSave 抛出异常: ' + e.message, 'error');
      }
    }
    
    // 4. 测试 manualSync
    async function testManualSync() {
      log('测试 manualSync 函数...');
      
      if(typeof manualSync !== 'function') {
        log('❌ manualSync 函数未定义，请先加载 game.js', 'error');
        return;
      }
      
      try {
        log('开始调用 manualSync...');
        await manualSync();
        log('✅ manualSync 执行完成', 'success');
      } catch(e) {
        log('❌ manualSync 抛出异常: ' + e.message, 'error');
      }
    }
  </script>
  
  <!-- 加载 game.js（需要在游戏页面登录后使用） -->
  <script src="game.js"></script>
</body>
</html>
